[project]
name = "agentreader-agents"
version = "1.10.0"
description = "PydanticAI + OpenAI Agents SDK function tools for Axiom Works AgentReader (x402 USDC on Base)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Axiom Works", email = "info@axiomworks.co.uk" }]
keywords = ["pydantic-ai", "openai-agents", "x402", "ai-agents", "usdc", "base", "agentreader", "axiomworks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["agentreader-tools>=1.10.0", "pydantic>=2"]

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai>=0.2"]
openai-agents = ["openai-agents>=0.1"]
all = ["pydantic-ai>=0.2", "openai-agents>=0.1"]

[project.urls]
Homepage = "https://grokbot1233.github.io/agentreader/"
Source = "https://github.com/grokbot1233/agentreader"
Documentation = "https://api.axiomworks.co.uk/llms.txt"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
