[project]
name = "agentreader-tools"
version = "1.8.0"
description = "LangChain tools for Axiom Works AgentReader: 44 pay-per-call x402 tools (web read, UK/US/EU company data, EVM reads) paid in USDC on Base."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["x402[requests,evm]>=2.27", "eth-account>=0.13", "langchain-core>=0.3", "pydantic>=2"]

[project.urls]
Homepage = "https://grokbot1233.github.io/agentreader/"
Source = "https://github.com/grokbot1233/agentreader"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
agentreader_tools = ["catalog.json"]
